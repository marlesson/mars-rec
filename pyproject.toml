[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mars-rec"
version = "0.1.0"
description = "MARS-Rec: framework to model, train, and evaluate deep-learning recommendation systems (successor of MARS-Gym Lite)."
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "MARS-Gym Authors" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "luigi>=3.5,<4",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "torch>=2.4",
    "pytorch-lightning>=2.4,<3",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.13",
    "tensorboardx>=2.6",
    "tqdm>=4.65,<5",
    "requests>=2.31,<3",
    "diskcache>=5.6",
    "psutil>=6.0,<8",
    "click>=8.1",
    # parquet I/O for `mars-rec predict` / `evaluate --data *.parquet`.
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/marlesson/mars-rec"

[project.scripts]
mars-rec = "mars_rec.cli:cli"

# -----------------------------------------------------------------------------
# Build backend (hatchling)
# -----------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/mars_rec"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "AGENTS.md",
    "examples/",
    "requirements.lock",
]

# -----------------------------------------------------------------------------
# Ruff (replaces flake8 + black; faster and unified)
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "output",
    "checkpoints",
    "lightning_logs",
]

[tool.ruff.lint]
# Conservative initial rule set (same scope as the previous flake8 run).
# Future PRs can opt into pyupgrade ("UP"), bugbear ("B"), etc.
#
# E501 (line too long): line-length=120 is the policy.
# E741 (ambiguous variable name `l`): used as sequence-length in many models.
# E731 (lambda): allowed.
ignore = ["E501", "E741", "E731"]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F811"]  # fixtures often look unused/redefined
"examples/**/*.py" = ["E402"]  # examples may tweak sys.path before imports

[tool.ruff.format]
# Match black defaults: double quotes, indent=4
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning:luigi.*",
]
markers = [
    "slow: heavyweight tests that orchestrate Luigi end-to-end (>30s/test)",
]
