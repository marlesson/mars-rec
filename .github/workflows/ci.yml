name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly dependency audit (Mondays 06:00 UTC)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CPU-only torch wheels: skips the multi-GB CUDA downloads.
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.17,<0.18"
      - run: make lint

  # Tests the exact pinned stack that ships in the Docker image.
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported versions.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: make install-locked
      - name: Run tests (with coverage floor)
        run: make test-ci

  # Early warning: newest versions allowed by pyproject.toml, ignoring the
  # lock. A failure here does not block the PR; it means the next
  # `make lock-upgrade` will need work.
  test-latest:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install latest dependencies
        run: pip install --extra-index-url "$TORCH_INDEX" -e ".[dev]"
      - name: Run tests
        run: make test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: make audit
