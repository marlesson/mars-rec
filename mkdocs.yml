site_name: MARS-Rec
site_url: https://marlesson.github.io/mars-rec/
site_description: Framework to model, train, and evaluate deep-learning recommendation systems.
repo_url: https://github.com/marlesson/mars-rec
repo_name: marlesson/mars-rec
edit_uri: edit/main/docs/
copyright: MIT License

# Fail the build on broken links / unresolved references (CI runs `mkdocs build --strict`).
strict: true

# Docs-only helpers (griffe extension) live next to the pages but are not published.
exclude_docs: |
  _ext/

theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - mkdocs-click

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            # Docstrings mix Sphinx (`:param x:`) and Google (`Args:`) sections.
            docstring_style: auto
            docstring_options:
              per_style_options:
                google:
                  ignore_init_summary: true
                  # Types come from the signatures; most docstrings do not repeat them.
                  warn_missing_types: false
            # Converts Sphinx roles (:class:`X`, :func:`Y`, ...) into Markdown.
            extensions:
              - docs/_ext/griffe_sphinx_roles.py
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2
            summary: true

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Concepts:
      - concepts/index.md
      - ProjectConfig & columns: concepts/project-config.md
      - Models: concepts/models.md
      - Pipeline: concepts/pipeline.md
      - Ranking evaluation: concepts/evaluation.md
      - Index mapping: concepts/index-mapping.md
      - Outputs & caching: concepts/outputs.md
  - Tutorials:
      - tutorials/index.md
      - Your first project: tutorials/custom-project.md
      - Synthetic (offline quickstart): tutorials/synthetic.md
      - MovieLens 1M (NCF): tutorials/movielens.md
      - Last.fm (sequential): tutorials/lastfm.md
      - Last.fm next-item (CE): tutorials/lastfm-next-item.md
      - Online Retail (session-based): tutorials/online-retail.md
      - Amazon Beauty (content-based): tutorials/amazon-beauty.md
      - MovieLens 100K (slate ranking): tutorials/movielens100k-slate.md
      - MovieLens 100K (retrieval, InfoNCE): tutorials/movielens100k-retrieval.md
  - Guides:
      - guides/index.md
      - Training parameters: guides/training-parameters.md
      - Inference & evaluation: guides/inference-evaluation.md
      - Extending the framework: guides/extending.md
      - Docker & Vertex AI: guides/docker-vertex.md
      - Configuration: guides/configuration.md
      - Dependencies: guides/dependencies.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - reference/index.md
      - CLI: reference/cli.md
      - API:
          - mars_rec.meta_config: reference/api/meta_config.md
          - mars_rec.simulation.training: reference/api/training.md
          - mars_rec.inference: reference/api/inference.md
          - mars_rec.evaluation: reference/api/evaluation.md
          - mars_rec.filtering: reference/api/filtering.md
          - mars_rec.visualization: reference/api/visualization.md
          - mars_rec.data: reference/api/data.md
          - mars_rec.model: reference/api/model.md
          - mars_rec.torch: reference/api/torch.md
          - mars_rec.utils: reference/api/utils.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/marlesson/mars-rec
